<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
<defs>
  <style>
    @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(500px)}}
    @keyframes glw{0%,100%{opacity:.75}50%{opacity:1}}
    .s{animation:twinkle var(--d,2s) ease-in-out infinite}
    .cur{animation:blink 1s step-end infinite}
    .tg{animation:glw 3s ease-in-out infinite}
    .scl{animation:scan 7s linear infinite}
  </style>
  <pattern id="g" width="8" height="8" patternUnits="userSpaceOnUse">
    <path d="M8 0L0 0 0 8" fill="none" stroke="#131a24" stroke-width=".4"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060a12"/><stop offset="100%" stop-color="#0a0f1c"/>
  </linearGradient>
  <linearGradient id="bblue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1a5fb4"/><stop offset="100%" stop-color="#58a6ff"/>
  </linearGradient>
  <linearGradient id="bgrn" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1a7340"/><stop offset="100%" stop-color="#39d353"/>
  </linearGradient>
  <linearGradient id="bgld" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7a5800"/><stop offset="100%" stop-color="#f0c060"/>
  </linearGradient>
  <linearGradient id="bpur" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5a1a8a"/><stop offset="100%" stop-color="#bf60ff"/>
  </linearGradient>
  <clipPath id="tc"><rect x="86" y="436" width="808" height="32"/></clipPath>
  <filter id="gf">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
    <feFlood flood-color="#58a6ff" flood-opacity=".45" result="c"/>
    <feComposite in="c" in2="b" operator="in" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- BG -->
<rect width="900" height="480" fill="url(#bg)"/>
<rect width="900" height="480" fill="url(#g)" opacity=".5"/>

<!-- Stars -->
<circle class="s" cx="35" cy="22" r="1.5" fill="#fff" style="--d:2.1s"/>
